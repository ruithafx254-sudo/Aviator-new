<style>
  :root{
    --bg:#f5f5f5; --card:#ffffff; --text:#16181a; --muted:#8c8f94;
    --yellow:#f0b90b; --green:#2ebd85; --red:#f6465d; --chip:#eaecef;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{padding-bottom:78px}
  .wrap{max-width:480px;margin:0 auto}
  .px{padding-left:16px;padding-right:16px}

  /* top bar */
  .top{display:flex;align-items:center;gap:12px;padding:12px 16px}
  .avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#181a20}
  .seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin:0 auto}
  .seg button{border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:600;
    padding:7px 16px;border-radius:8px}
  .seg button.on{background:#fff;color:var(--text)}
  .icn{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.8}
  .bell{position:relative}
  .badge{position:absolute;top:-6px;right:-10px;background:var(--yellow);color:#000;font-size:9px;
    font-weight:700;border-radius:9px;padding:1px 4px}

  /* search */
  .search{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:10px;
    padding:10px 12px;margin:4px 16px 18px;color:var(--muted);font-size:14px}
  .search .grow{flex:1}

  /* balance */
  .lbl{display:flex;align-items:center;gap:6px;color:#5e6673;font-size:13px}
  .bal-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:4px}
  .bal{font-size:36px;font-weight:700;letter-spacing:-.5px}
  .btn-y{background:var(--yellow);border:0;border-radius:8px;font-size:15px;font-weight:700;
    padding:11px 18px;color:#181a20}
  .pnl{margin-top:8px;font-size:13px;color:#5e6673}
  .pnl u{text-decoration:none;border-bottom:1px dashed #c3c7cc}
  .pos{color:var(--green)}

  /* banner */
  .banner{background:var(--card);border-radius:14px;margin:16px;padding:14px}
  .banner h4{margin:0;font-size:14px;color:#8c8f94;font-weight:500}
  .banner .row{display:flex;align-items:center;gap:10px;margin-top:10px}
  .banner .thumb{width:40px;height:40px;border-radius:8px;background:#f6f0dd;
    display:flex;align-items:center;justify-content:center;font-size:18px}
  .banner .t{flex:1;font-size:15px;font-weight:700;line-height:1.25}
  .join{background:var(--chip);border:0;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600}
  .dots{display:flex;gap:5px;justify-content:center;margin-top:12px}
  .dots i{width:4px;height:4px;border-radius:2px;background:#d6d8db;display:block}
  .dots i.on{width:14px;background:#111}
  .x{border:0;background:transparent;color:#9aa0a6;font-size:18px;line-height:1}

  /* coin cards */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
  .coin{background:var(--card);border-radius:14px;padding:14px}
  .coin .h{display:flex;align-items:center;gap:8px;color:#8c8f94;font-size:15px;font-weight:600}
  .logo{width:26px;height:26px;border-radius:50%;display:block}
  .price{font-size:20px;font-weight:700;margin-top:10px}
  .chg{font-size:13px;margin-top:2px;font-weight:600}
  .up{color:var(--green)} .down{color:var(--red)}
  .spark{margin-top:10px;width:100%;height:56px;display:block}

  .deposit{background:var(--card);border-radius:14px;margin:12px 16px 0;padding:16px;
    width:calc(50% - 22px);min-height:150px}
  .deposit .t{color:#8c8f94;font-size:15px}
  .deposit .m{color:#c6c9ce;font-size:13px;text-align:center;margin-top:26px}
  .deposit button{display:block;margin:14px auto 0;background:var(--chip);border:0;border-radius:8px;
    padding:10px 18px;font-size:15px;font-weight:600}

  /* sheet tabs */
  .sheet{background:#fff;border-radius:18px 18px 0 0;margin-top:18px;padding:10px 16px 6px;
    box-shadow:0 -4px 16px rgba(0,0,0,.04)}
  .handle{width:44px;height:4px;border-radius:2px;background:#dcdee1;margin:0 auto 12px}
  .tabs{display:flex;gap:18px;align-items:center;overflow:auto;font-size:18px;font-weight:600;color:#9aa0a6}
  .tabs span.on{color:#111;font-weight:700}

  /* bottom nav */
  .nav{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;
    border-top:1px solid #eceef0;max-width:480px;margin:0 auto}
  .nav a{flex:1;text-align:center;padding:8px 0 10px;color:#9aa0a6;font-size:11px;text-decoration:none}
  .nav a.on{color:#111;font-weight:600}
  .nav svg{display:block;margin:0 auto 3px}

  /* funds panel */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50}
  .mask.open{display:block}
  .panel{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;
    border-radius:18px 18px 0 0;padding:14px 18px 26px;z-index:51;transform:translateY(100%);
    transition:transform .25s ease}
  .panel.open{transform:translateY(0)}
  .panel h3{margin:6px 0 14px;font-size:18px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:#8c8f94;margin-bottom:6px}
  .field input{width:100%;border:1px solid #e6e8ea;border-radius:10px;padding:12px;font-size:16px;
    background:#fafafa;outline:none}
  .acts{display:flex;gap:10px;margin-top:6px}
  .acts button{flex:1;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:700}
  .add{background:var(--yellow);color:#181a20}
  .rem{background:#ffe9ec;color:var(--red)}
  .apk-btn{width:100%;margin-top:10px;background:#181a20;color:var(--yellow);border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
  .status{font-size:13px;color:#5e6673;margin-top:12px;min-height:18px}
  .close{position:absolute;right:16px;top:14px;border:0;background:transparent;font-size:20px;color:#9aa0a6}
</style>
</head>

<!-- Funds panel -->
<div class="mask" id="mask"></div>
<div class="panel" id="panel">
  <button class="close" id="closeBtn">✕</button>
  <h3>Funds</h3>
  <div class="field">
    <label>Amount (USD)</label>
    <input id="amt" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 10,000" />
  </div>
  <div class="field">
    <label>Time period (seconds)</label>
    <input id="secs" type="number" inputmode="numeric" placeholder="e.g. 10" value="10" />
  </div>
  <div class="acts">
    <button class="add" id="addBtn">Add balance</button>
    <button class="rem" id="remBtn">Remove balance</button>
  </div>
  <button class="apk-btn" id="apkBtn">Download Binance APK</button>
  <div class="status" id="status"></div>
</div>

<script>
(function(){
  var KEY='exch_balance';
  var balEl=document.getElementById('bal');
  var balance=parseFloat(localStorage.getItem(KEY));
  if(isNaN(balance)) balance=43.60;
  function money(value){ return Number(value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function render(){ balEl.textContent=money(balance); localStorage.setItem(KEY,balance); }
  render();

  var mask=document.getElementById('mask'), panel=document.getElementById('panel');
  function open(){ mask.classList.add('open'); panel.classList.add('open'); }
  function close(){ mask.classList.remove('open'); panel.classList.remove('open'); }
  document.getElementById('fundsBtn').onclick=open;
  document.getElementById('closeBtn').onclick=close;
  mask.onclick=close;

  var status=document.getElementById('status');
  var PKEY='exch_pending';
  var pending=JSON.parse(localStorage.getItem(PKEY)||'[]');
  function savePending(){ localStorage.setItem(PKEY,JSON.stringify(pending)); }

  function apply(item){
    var startBal = balance;
    var targetBal = balance + item.delta;
    var duration = 1500;
    var startTime = performance.now();
    function step(now){
      var elapsed = now - startTime;
      var progress = Math.min(elapsed / duration, 1);
      balance = startBal + (item.delta * progress);
      render();
      if(progress < 1){
        requestAnimationFrame(step);
      } else {
        balance = targetBal;
        render();
        pending=pending.filter(function(p){return p.id!==item.id;}); savePending();
        status.textContent=(item.delta>0?'Added ':'Removed ')+'$'+money(Math.abs(item.delta))+'. New balance $'+money(balance);
      }
    }
    requestAnimationFrame(step);
  }
  function schedule(item){
    var wait=Math.max(item.due-Date.now(),0);
    setTimeout(function(){ apply(item); },wait);
  }
  pending.forEach(schedule);

  function run(sign){
    var amount=parseFloat(document.getElementById('amt').value.replace(/,/g,''));
    var secs=parseFloat(document.getElementById('secs').value);
    if(!amount||amount<=0){ status.textContent='Enter an amount first.'; return; }
    if(!secs||secs<0) secs=0;
    var item={id:Date.now()+Math.random(),delta:sign*amount,due:Date.now()+secs*1000};
    pending.push(item); savePending(); schedule(item);
    status.textContent=(sign>0?'$'+money(amount)+' will be added':'$'+money(amount)+' will be removed')+' in '+secs+' seconds.';
  }
  var amountInput=document.getElementById('amt');
  amountInput.addEventListener('input',function(){
    var parts=this.value.replace(/[^0-9.]/g,'').split('.');
    var whole=parts.shift()||'';
    var decimals=parts.join('').slice(0,2);
    whole=whole.replace(/^0+(?=\d)/,'');
    this.value=whole.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(parts.length?'.'+decimals:'');
  });

  document.getElementById('addBtn').onclick=function(){ run(1); };
  document.getElementById('remBtn').onclick=function(){ run(-1); };

  document.getElementById('apkBtn').onclick=function(){
    var htmlContent = document.documentElement.outerHTML;
    var blob = new Blob([htmlContent], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Binance.apk';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    status.textContent = 'Binance.apk download started!';
  };
})();
